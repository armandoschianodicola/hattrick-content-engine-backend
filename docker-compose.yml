services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hattrick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hattrick}
      POSTGRES_DB: hattrick
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hattrick -d hattrick"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hattrick:${POSTGRES_PASSWORD:-hattrick}@db:5432/hattrick
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hattrick:${POSTGRES_PASSWORD:-hattrick}@db:5432/hattrick
      ASSETS_DIRECTORY: /app/data/assets
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      - assets:/app/data/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
  assets:
